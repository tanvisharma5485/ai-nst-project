
name: Neural Style Transfer CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q NST_Code

      - name: Verify model checkpoint
        run: test -f NST_Code/experiment/final_exp/decoder_final.pth

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    # Publish only after a push to main, not on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            tanvikumari03/ai-nst-project:latest
            tanvikumari03/ai-nst-project:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy with automatic rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            IMAGE="tanvikumari03/ai-nst-project:latest"
            CONTAINER="ai-nst-app"
            PREVIOUS="ai-nst-app-previous"
            BACKUP_IMAGE=""

            echo "Pulling new image..."
            sudo docker pull "$IMAGE"

            # Remember the image used by the current container.
            if sudo docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              BACKUP_IMAGE=$(sudo docker inspect \
                --format '{{.Image}}' "$CONTAINER")
            fi

            # Remove any stale backup container.
            sudo docker rm -f "$PREVIOUS" 2>/dev/null || true

            # Preserve the current container before replacing it.
            if sudo docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              sudo docker rename "$CONTAINER" "$PREVIOUS"
              sudo docker stop "$PREVIOUS" || true
            fi

            # Start the new version.
            if ! sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE"; then
              echo "New container failed to start."
            else
              echo "Waiting for application startup..."
              sleep 15

              if sudo docker exec "$CONTAINER" \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)" \
                && sudo docker inspect \
                  --format '{{.State.Running}}' "$CONTAINER" | grep -q true; then
                echo "Deployment successful."
                sudo docker rm -f "$PREVIOUS" 2>/dev/null || true
                exit 0
              fi

              echo "Health check failed."
            fi

            # Roll back to the previous container if one existed.
            echo "Rolling back deployment..."
            sudo docker rm -f "$CONTAINER" 2>/dev/null || true

            if sudo docker container inspect "$PREVIOUS" >/dev/null 2>&1; then
              sudo docker rename "$PREVIOUS" "$CONTAINER"
              sudo docker start "$CONTAINER"

              if sudo docker exec "$CONTAINER" \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=10)"; then
                echo "Rollback successful. Previous version restored."
              else
                echo "WARNING: Previous container restarted but health check failed."
                exit 1
              fi
            else
              echo "No previous container available to restore."
              exit 1
            fi

            exit 1

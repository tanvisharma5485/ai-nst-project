
name: Neural Style Transfer CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q NST_Code

      - name: Verify model checkpoint
        run: test -f NST_Code/experiment/final_exp/decoder_final.pth

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    # Publish only after a push to main, not on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            tanvikumari03/ai-nst-project:latest
            tanvikumari03/ai-nst-project:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            sudo docker pull tanvikumari03/ai-nst-project:latest

            echo "Replacing existing container..."
            sudo docker rm -f ai-nst-app || true

            echo "Starting updated application..."
            sudo docker run -d \
              --name ai-nst-app \
              --restart unless-stopped \
              -p 5000:5000 \
              tanvikumari03/ai-nst-project:latest

            echo "Waiting for application to start..."
            sleep 10

            echo "Checking application health..."
            curl -fsS http://localhost:5000/ > /dev/null

            echo "Deployment successful!"
            sudo docker ps --filter name=ai-nst-app
